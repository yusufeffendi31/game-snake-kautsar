<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101b36">
<title>Ular Tangga Gattouz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(145deg,#101b36,#263e70,#44276a);
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  text-align: center;
  padding: 10px;
}

header h1 {
  margin: 4px;
  font-size: clamp(23px,4vw,38px);
  color: #ffdf65;
  text-shadow: 0 3px 12px #0008;
}

header p {
  margin: 5px;
  color: #d5e3ff;
  font-size: 13px;
}

.main {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 5px 12px 20px;
}

.game-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.board-frame {
  width: min(100%, calc(100svh - 170px));
  aspect-ratio: 1;
  position: relative;
  padding: 5px;
  background: linear-gradient(135deg,#ffd86b,#a66b23);
  border: 3px solid #ffe9a6;
  border-radius: 15px;
  box-shadow: 0 10px 35px #0008;
}

#board {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(10,1fr);
  grid-template-rows: repeat(10,1fr);
  position: relative;
  overflow: hidden;
  border-radius: 7px;
  background: #1c3350;
}

.cell {
  min-width: 0;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff0bd;
  color: #28344a;
  border: 1px solid #b79a62;
  overflow: hidden;
}

.cell:nth-child(4n+2) {
  background: #c7f4d4;
}

.cell:nth-child(4n+3) {
  background: #c6e7ff;
}

.cell:nth-child(4n) {
  background: #ffe0eb;
}

.cell.start {
  background: #83e8a5;
}

.cell.finish {
  background: #ffcc64;
}

.num {
  position: absolute;
  top: 2px;
  left: 3px;
  font-size: clamp(7px,1.5vw,13px);
  font-weight: 900;
  z-index: 4;
}

.special-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: clamp(13px,2.8vw,25px);
  z-index: 3;
}

.token-area {
  position: absolute;
  bottom: 2px;
  right: 2px;
  display: flex;
  z-index: 5;
}

.token {
  font-size: clamp(12px,2.6vw,23px);
  animation: tokenPop .22s ease;
  filter: drop-shadow(0 2px 2px #0008);
}

@keyframes tokenPop {
  0% { transform: scale(.2); }
  70% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* GAMBAR ULAR DAN TANGGA */

#paths {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  overflow: visible;
}

.snake-body {
  fill: none;
  stroke: #168e43;
  stroke-width: 17;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(2px 4px 2px #0007);
}

.snake-highlight {
  fill: none;
  stroke: #8ffb9c;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 7 12;
}

.snake-head {
  fill: #21ad50;
  stroke: #075a27;
  stroke-width: 4;
}

.snake-eye {
  fill: white;
}

.snake-pupil {
  fill: #172c20;
}

.ladder-rail {
  fill: none;
  stroke: #9a501a;
  stroke-width: 10;
  stroke-linecap: round;
  filter: drop-shadow(2px 3px 2px #0006);
}

.ladder-inner {
  fill: none;
  stroke: #f6c36e;
  stroke-width: 5;
  stroke-linecap: round;
}

.ladder-rung {
  stroke: #f6c36e;
  stroke-width: 7;
  stroke-linecap: round;
}

.controls {
  width: min(100%,600px);
  padding: 12px;
  background: #ffffff17;
  border: 1px solid #ffffff30;
  border-radius: 15px;
  backdrop-filter: blur(10px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  align-items: center;
}

.player {
  background: #ffffff16;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 9px;
  font-size: 13px;
}

.player.active {
  border-color: #ffdf65;
  background: #ffdf6520;
}

.player strong {
  display: block;
  font-size: 15px;
  margin-bottom: 5px;
}

#diceBox {
  grid-column: 1 / -1;
  text-align: center;
  background: #101e3b99;
  border-radius: 12px;
  padding: 8px;
}

#dice {
  font-size: 55px;
  display: block;
  line-height: 1.2;
  filter: drop-shadow(0 4px 4px #0008);
}

.dice-roll {
  animation: diceSpin .12s infinite linear;
}

@keyframes diceSpin {
  0% { transform: rotate(0) scale(1); }
  50% { transform: rotate(180deg) scale(1.2); }
  100% { transform: rotate(360deg) scale(1); }
}

#diceResult {
  color: #ffdf65;
  font-weight: bold;
  margin-top: 5px;
}

#message {
  grid-column: 1 / -1;
  text-align: center;
  background: #ffffff12;
  padding: 10px;
  border-radius: 9px;
  min-height: 38px;
  font-size: 13px;
}

button, select {
  border: none;
  border-radius: 9px;
  padding: 11px;
  font-weight: bold;
  font-size: 14px;
  font-family: inherit;
}

select {
  width: 100%;
  background: white;
  color: #222;
}

button {
  cursor: pointer;
  transition: transform .15s, filter .15s;
}

button:active {
  transform: scale(.94);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.roll-button {
  grid-column: 1 / -1;
  background: linear-gradient(135deg,#ffb52e,#ffe477);
  color: #342000;
  font-size: 19px;
  padding: 15px;
  box-shadow: 0 4px 0 #a96b12;
}

.other-buttons {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
}

.other-buttons button {
  flex: 1;
  background: #526c9e;
  color: white;
}

.history {
  grid-column: 1 / -1;
  background: #101e3b99;
  border-radius: 10px;
  padding: 9px;
  font-size: 12px;
}

#log {
  height: 55px;
  overflow-y: auto;
  line-height: 1.7;
  color: #dce9ff;
}

.overlay {
  position: fixed;
  inset: 0;
  background: #071126eF;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
  padding: 20px;
}

.overlay.show {
  display: flex;
}

.win-box {
  width: min(380px,100%);
  background: linear-gradient(145deg,#294a82,#59327c);
  border: 2px solid #ffdf65;
  border-radius: 20px;
  text-align: center;
  padding: 25px;
  animation: winPop .5s ease;
}

@keyframes winPop {
  from { transform: scale(.4); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.win-emoji {
  font-size: 65px;
  animation: celebrate .8s infinite alternate;
}

@keyframes celebrate {
  from { transform: rotate(-8deg) scale(1); }
  to { transform: rotate(8deg) scale(1.15); }
}

.win-box h2 {
  color: #ffe276;
  font-size: 27px;
}

.win-box button {
  background: #ffdf65;
  color: #342000;
  width: 100%;
  margin-top: 10px;
}

@media(max-width:600px) {
  header {
    padding: 5px;
  }

  .main {
    padding: 3px 5px 15px;
  }

  .board-frame {
    width: min(calc(100vw - 10px), calc(100svh - 240px));
    padding: 3px;
    border-width: 2px;
  }

  .controls {
    width: 100%;
    padding: 9px;
    gap: 7px;
  }

  #dice {
    font-size: 43px;
  }

  button {
    padding: 10px 5px;
  }
}

@media(orientation:landscape) and (max-height:600px) {
  header {
    padding: 2px;
  }

  header h1 {
    font-size: 20px;
  }

  header p {
    display: none;
  }

  .game-area {
    flex-direction: row;
    align-items: center;
  }

  .board-frame {
    width: min(calc(100svh - 15px),65vw);
    flex-shrink: 0;
  }

  .controls {
    width: min(35vw,380px);
  }
}
</style>
</head>

<body>

<header>
  <h1>🐍 ULAR TANGGA GATTOUZ 🪜</h1>
  <p>Roll the dice • Climb the ladder • Avoid the snake!</p>
</header>

<main class="main">
<div class="game-area">

  <div class="board-frame">
    <div id="board">
      <svg id="paths" viewBox="0 0 1000 1000"
           preserveAspectRatio="none"></svg>
    </div>
  </div>

  <section class="controls">

    <div class="player active" id="player1">
      <strong>🔴 PEMAIN 1</strong>
      <span id="pos1">Kotak: 1</span>
    </div>

    <div class="player" id="player2">
      <strong id="player2Name">🤖 KOMPUTER</strong>
      <span id="pos2">Kotak: 1</span>
    </div>

    <div style="grid-column:1/-1">
      <select id="mode" onchange="changeMode()">
        <option value="bot">🤖 Pemain vs Komputer</option>
        <option value="friend">👥 Dua Pemain</option>
      </select>
    </div>

    <div id="diceBox">
      <span id="dice">🎲</span>
      <div id="diceResult">Siap bermain?</div>
    </div>

    <div id="message">Selamat datang di Ular Tangga Gattouz!</div>

    <button id="rollButton" class="roll-button" onclick="rollDice()">
      🎲 LEMPAR DADU
    </button>

    <div class="other-buttons">
      <button onclick="resetGame()">🔄 Reset</button>
      <button onclick="toggleSound()" id="soundButton">🔊 Suara ON</button>
      <button onclick="fullScreen()">⛶ Full Screen</button>
    </div>

    <div class="history">
      <strong>📜 RIWAYAT PERMAINAN</strong>
      <div id="log">Permainan dimulai!</div>
    </div>

  </section>
</div>
</main>

<div class="overlay" id="winnerOverlay">
  <div class="win-box">
    <div class="win-emoji">🏆🎉</div>
    <h2>GATTOUZ CHAMPION!</h2>
    <h3 id="winnerName">Pemain 1 Menang!</h3>
    <p>Hebat! Kamu berhasil mencapai kotak 100!</p>
    <button onclick="resetGame()">🔄 MAIN LAGI</button>
  </div>
</div>

<script>

// ====================================
// DATA PAPAN
// ====================================

const snakes = {
  16:6,
  47:26,
  49:11,
  56:53,
  62:19,
  64:60,
  87:24,
  93:73,
  95:75,
  98:78
};

const ladders = {
  2:23,
  4:14,
  8:34,
  21:42,
  28:76,
  36:44,
  51:67,
  71:91,
  80:100
};

let positions = [1,1];
let currentPlayer = 0;
let busy = false;
let gameOver = false;
let soundOn = true;
let audio = null;

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

// ====================================
// POSISI KOTAK PADA PAPAN
// ====================================

function getPoint(n) {
  const row = Math.floor((n-1)/10);
  const offset = (n-1)%10;

  const col = row%2===0 ? offset : 9-offset;
  const screenRow = 9-row;

  return {
    x: col*100+50,
    y: screenRow*100+50
  };
}

// ====================================
// MEMBUAT PAPAN
// ====================================

function createBoard() {

  const board = document.getElementById("board");
  board.innerHTML = "";

  for(let row=9;row>=0;row--) {

    let nums = [];

    for(let col=0;col<10;col++) {
      nums.push(row*10+col+1);
    }

    if(row%2===1) nums.reverse();

    nums.forEach(n => {

      const cell = document.createElement("div");
      cell.className = "cell";
      cell.id = "cell"+n;

      if(n===1) cell.classList.add("start");
      if(n===100) cell.classList.add("finish");

      let symbol = "";

      if(snakes[n]) symbol = "🐍";
      if(ladders[n]) symbol = "🪜";
      if(n===1) symbol = "🚩";
      if(n===100) symbol = "🏆";

      cell.innerHTML = `
        <span class="num">${n}</span>
        <span class="special-icon">${symbol}</span>
        <div class="token-area" id="token${n}"></div>
      `;

      board.appendChild(cell);
    });
  }

  drawPaths();
  updateBoard();
}

// ====================================
// MENGGAMBAR ULAR DAN TANGGA
// ====================================

function drawPaths() {

  const svg = document.getElementById("paths");
  let html = "";

  // Ular digambar dari kepala (kotak awal)
  // menuju ekor (kotak tujuan turun).

  Object.entries(snakes).forEach(([from,to],index) => {

    const a = getPoint(Number(from));
    const b = getPoint(Number(to));

    const dx = b.x-a.x;
    const dy = b.y-a.y;

    const bend = index%2===0 ? 55 : -55;

    const cx = (a.x+b.x)/2 + bend;
    const cy = (a.y+b.y)/2;

    const path =
      `M ${a.x} ${a.y}
       Q ${cx} ${cy} ${b.x} ${b.y}`;

    html += `
      <path class="snake-body" d="${path}"/>
      <path class="snake-highlight" d="${path}"/>

      <circle class="snake-head"
        cx="${a.x}" cy="${a.y}" r="15"/>

      <circle class="snake-eye"
        cx="${a.x-5}" cy="${a.y-4}" r="4"/>

      <circle class="snake-eye"
        cx="${a.x+5}" cy="${a.y-4}" r="4"/>

      <circle class="snake-pupil"
        cx="${a.x-5}" cy="${a.y-4}" r="1.8"/>

      <circle class="snake-pupil"
        cx="${a.x+5}" cy="${a.y-4}" r="1.8"/>

      <path d="M ${a.x} ${a.y+12}
        l -4 8 M ${a.x} ${a.y+12}
        l 4 8"
        stroke="#ff6683" stroke-width="3" fill="none"/>
    `;
  });

  // Tangga dengan dua sisi dan anak tangga.

  Object.entries(ladders).forEach(([from,to]) => {

    const a = getPoint(Number(from));
    const b = getPoint(Number(to));

    const dx = b.x-a.x;
    const dy = b.y-a.y;

    const length = Math.hypot(dx,dy);
    const px = -dy/length*13;
    const py = dx/length*13;

    const x1 = a.x+px;
    const y1 = a.y+py;
    const x2 = a.x-px;
    const y2 = a.y-py;

    const x3 = b.x+px;
    const y3 = b.y+py;
    const x4 = b.x-px;
    const y4 = b.y-py;

    html += `
      <line class="ladder-rail"
        x1="${x1}" y1="${y1}" x2="${x3}" y2="${y3}"/>

      <line class="ladder-rail"
        x1="${x2}" y1="${y2}" x2="${x4}" y2="${y4}"/>

      <line class="ladder-inner"
        x1="${x1}" y1="${y1}" x2="${x3}" y2="${y3}"/>

      <line class="ladder-inner"
        x1="${x2}" y1="${y2}" x2="${x4}" y2="${y4}"/>
    `;

    for(let i=1;i<7;i++) {

      const t=i/7;

      const leftX = x1+(x3-x1)*t;
      const leftY = y1+(y3-y1)*t;
      const rightX = x2+(x4-x2)*t;
      const rightY = y2+(y4-y2)*t;

      html += `
        <line class="ladder-rung"
          x1="${leftX}" y1="${leftY}"
          x2="${rightX}" y2="${rightY}"/>
      `;
    }
  });

  svg.innerHTML = html;
}

// ====================================
// UPDATE PION
// ====================================

function updateBoard() {

  for(let i=1;i<=100;i++) {
    document.getElementById("token"+i).innerHTML = "";
  }

  positions.forEach((pos,index) => {

    const token = document.createElement("span");
    token.className = "token";
    token.textContent = index===0 ? "🔴" : "🔵";

    document.getElementById("token"+pos).appendChild(token);
  });

  document.getElementById("pos1").textContent =
    "Kotak: "+positions[0];

  document.getElementById("pos2").textContent =
    "Kotak: "+positions[1];

  document.getElementById("player1").classList.toggle(
    "active",currentPlayer===0
  );

  document.getElementById("player2").classList.toggle(
    "active",currentPlayer===1
  );
}

// ====================================
// SUARA
// ====================================

function playSound(freq=440,duration=.12) {

  if(!soundOn) return;

  try {

    audio = audio ||
      new (window.AudioContext || window.webkitAudioContext)();

    if(audio.state==="suspended") audio.resume();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.frequency.value = freq;
    gain.gain.setValueAtTime(.1,audio.currentTime);

    gain.gain.exponentialRampToValueAtTime(
      .001,audio.currentTime+duration
    );

    oscillator.start();
    oscillator.stop(audio.currentTime+duration);

  } catch(e) {}
}

function toggleSound() {

  soundOn = !soundOn;

  document.getElementById("soundButton").textContent =
    soundOn ? "🔊 Suara ON" : "🔇 Suara OFF";

  if(soundOn) playSound(700);
}

// ====================================
// ANIMASI DADU
// ====================================

async function animateDice() {

  const dice = document.getElementById("dice");

  dice.classList.add("dice-roll");

  for(let i=0;i<15;i++) {

    const fake = Math.floor(Math.random()*6);

    dice.textContent = ["⚀","⚁","⚂","⚃","⚄","⚅"][fake];

    playSound(250+fake*60,.05);

    await sleep(75);
  }

  const result = Math.floor(Math.random()*6)+1;

  dice.textContent = ["⚀","⚁","⚂","⚃","⚄","⚅"][result-1];

  dice.classList.remove("dice-roll");

  document.getElementById("diceResult").textContent =
    "ANGKA DADU: "+result;

  playSound(700,.2);

  return result;
}

// ====================================
// PION BERGERAK SATU PER SATU
// ====================================

async function movePlayer(player,target) {

  const direction =
    target>positions[player] ? 1 : -1;

  while(positions[player]!==target) {

    positions[player]+=direction;

    updateBoard();

    playSound(direction>0 ? 400 : 270,.04);

    await sleep(170);
  }

  playSound(650,.15);
}

// ====================================
// RIWAYAT
// ====================================

function addLog(text) {

  const log = document.getElementById("log");
  const item = document.createElement("div");

  item.textContent = "• "+text;
  log.prepend(item);

  while(log.children.length>20) {
    log.lastElementChild.remove();
  }
}

// ====================================
// GILIRAN
// ====================================

function updateTurn() {

  const bot =
    document.getElementById("mode").value==="bot";

  const name = currentPlayer===0 ?
    "Pemain 1" :
    (bot ? "Komputer" : "Pemain 2");

  document.getElementById("rollButton").disabled =
    busy || gameOver || (bot && currentPlayer===1);
}

// ====================================
// PROSES PERMAINAN
// ====================================

async function rollDice() {

  if(busy || gameOver) return;

  busy = true;
  updateTurn();

  const player = currentPlayer;

  const bot =
    document.getElementById("mode").value==="bot";

  const name = player===0 ?
    "Pemain 1" :
    (bot ? "Komputer" : "Pemain 2");

  document.getElementById("message").textContent =
    name+" sedang melempar dadu...";

  const dice = await animateDice();

  const old = positions[player];
  const target = old+dice;

  await sleep(300);

  if(target>100) {

    document.getElementById("message").textContent =
      "😅 Belum bisa maju! Harus mendapatkan angka tepat untuk mencapai 100.";

    addLog(name+" mendapatkan "+dice+", belum bisa maju.");

  } else {

    document.getElementById("message").textContent =
      name+" berjalan "+dice+" langkah!";

    addLog(name+" melempar "+dice+".");

    await movePlayer(player,target);

    await sleep(250);

    if(ladders[target]) {

      const destination = ladders[target];

      document.getElementById("message").textContent =
        "🪜 YEAY! "+name+" menaiki tangga!";

      addLog(name+" naik dari "+target+" ke "+destination+".");

      playSound(850,.3);

      await sleep(450);

      await movePlayer(player,destination);

    } else if(snakes[target]) {

      const destination = snakes[target];

      document.getElementById("message").textContent =
        "🐍 OH TIDAK! "+name+" terkena ular!";

      addLog(name+" turun dari "+target+" ke "+destination+".");

      playSound(180,.4);

      await sleep(450);

      await movePlayer(player,destination);
    }

    if(positions[player]===100) {

      winGame(name);
      busy = false;
      return;
    }
  }

  await sleep(450);

  currentPlayer = 1-currentPlayer;

  busy = false;

  updateBoard();
  updateTurn();

  if(bot && currentPlayer===1 && !gameOver) {

    document.getElementById("message").textContent =
      "🤖 Komputer sedang berpikir...";

    setTimeout(() => rollDice(),1000);
  } else {

    document.getElementById("message").textContent =
      "Giliran "+(currentPlayer===0 ? "Pemain 1" : "Pemain 2")+"!";
  }
}

// ====================================
// PEMENANG
// ====================================

function winGame(name) {

  gameOver = true;

  document.getElementById("winnerName").textContent =
    name+" MENANG!";

  document.getElementById("message").textContent =
    "🏆 "+name+" berhasil menjadi juara!";

  document.getElementById("winnerOverlay").classList.add("show");

  document.getElementById("rollButton").disabled = true;

  addLog("🏆 "+name+" menjadi pemenang!");

  playSound(750,.3);

  setTimeout(()=>playSound(950,.3),250);
  setTimeout(()=>playSound(1200,.5),500);
}

// ====================================
// MODE
// ====================================

function changeMode() {

  const bot =
    document.getElementById("mode").value==="bot";

  document.getElementById("player2Name").textContent =
    bot ? "🤖 KOMPUTER" : "🔵 PEMAIN 2";

  resetGame();
}

// ====================================
// RESET
// ====================================

function resetGame() {

  positions = [1,1];
  currentPlayer = 0;
  busy = false;
  gameOver = false;

  document.getElementById("winnerOverlay").classList.remove("show");

  document.getElementById("dice").textContent = "🎲";

  document.getElementById("diceResult").textContent =
    "Siap bermain?";

  document.getElementById("message").textContent =
    "Permainan baru dimulai!";

  document.getElementById("log").innerHTML =
    "Game baru dimulai!";

  updateBoard();
  updateTurn();

  addLog("Permainan baru dimulai.");
}

// ====================================
// FULL SCREEN
// ====================================

function fullScreen() {

  if(!document.fullscreenElement) {

    document.documentElement.requestFullscreen?.()
      .catch(()=>{});

  } else {

    document.exitFullscreen?.();
  }
}

// ====================================
// START
// ====================================

createBoard();
updateTurn();

</script>
</body>
</html>
